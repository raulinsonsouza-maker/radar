services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prospeccao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospeccao}
      POSTGRES_DB: ${POSTGRES_DB:-prospeccao}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: production
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prospeccao}:${POSTGRES_PASSWORD:-prospeccao}@db:5432/${POSTGRES_DB:-prospeccao}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      SERVE_FRONTEND: "1"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
